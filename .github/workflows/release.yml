name: Release

# Publishes the package to npm when a version tag (v1.2.3, v0.1.0-alpha.1) is
# pushed. The tag must match package.json and point to a commit on main.
#
# npm trusts this workflow by its file name (npmjs.com, package settings,
# Trusted publishing), so it needs no npm token. Renaming the file breaks
# publishing until the trusted publisher is updated.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the GitHub release
  id-token: write # trusted publishing to npm (OIDC) and provenance

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # main, to check the tag is on it
      # Node 26 comes with npm 11.5.1 or later, which trusted publishing needs.
      # No dependency cache: a poisoned cache would end up in the published
      # package.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: The tag matches package.json and is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "The tag $TAG doesn't match the version $version in package.json."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The tag $TAG points to a commit that isn't on main."
            exit 1
          fi
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: sh scripts/release-notes.sh "${TAG#v}" > release-notes.md

      - run: npm ci
      - name: Format, lint, type check and test (oxfmt, oxlint, tsc, Vitest)
        run: npm run verify
      - name: Build (Vite, tsc, rollup-plugin-dts)
        run: npm run build
      - name: Check the types with "Are the types wrong?"
        run: npx attw --pack .

      # Pre-releases (0.1.0-alpha.1) get their own dist-tag ("alpha"), so
      # `npm install @x-ops-easy/xoe-validator` never picks them by accident.
      - name: Publish to npm
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          case "$version" in
            *-*) npm publish --tag "$(echo "$version" | sed -E 's/^[^-]+-([A-Za-z]+).*/\1/')" ;;
            *) npm publish --tag latest ;;
          esac
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            *-*) gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --prerelease ;;
            *) gh release create "$TAG" --title "$TAG" --notes-file release-notes.md ;;
          esac
